services:
  - type: web
    name: serbisyou-api
    runtime: node
    plan: free
    branch: Final_Version
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://serbisyou-frontend.onrender.com

  - type: web
    name: serbisyou-frontend
    runtime: static
    branch: Final_Version
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://serbisyou-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
